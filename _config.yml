locale: "en-US"
title: "Jingpeng Yang"
title_separator: "-"
name: "Jingpeng Yang"
description: &description "The academic homepage."
url: "https://nanasuk3.github.io"
baseurl: ""
repository: "NANASUK3/NANASUK3.github.io"

author:
  avatar: "avatar-256.webp"
  name: "Jingpeng Yang"
  name_zh: "杨靖鹏"
  pronouns:
  bio: "Embodied AI & Agent."
  location: "Hefei, China"
  employer:
  email: "yangjingpeng@ustc.edu.cn"

  github: NANASUK3
  kaggle:
  stackoverflow:
  linkedin:

teaser:
breadcrumbs: false
future: true

atom_feed:
  hide: false
  path:

analytics:
  provider: false

include:
  - _pages

exclude:
  - THIRD_PARTY_NOTICES.md
  - assets/js/_main.js
  - assets/js/plugins
  - package.json
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: UTC

plugins:
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-feed
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
