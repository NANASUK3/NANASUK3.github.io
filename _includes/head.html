{% include base_path %}

<meta charset="utf-8" />

{% include seo.html %}

<link
  href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}"
  type="application/atom+xml"
  rel="alternate"
  title="{{ site.title }} Feed"
/>

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True" />
<meta name="MobileOptimized" content="320" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script>
  document.documentElement.className =
    document.documentElement.className.replace(/\bno-js\b/g, "") + " js ";
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css" />
{% if page.stylesheets %} {% for stylesheet in page.stylesheets %}
<link rel="stylesheet" href="{{ stylesheet | prepend: base_path }}" />
{% endfor %} {% endif %}

<!-- Apply the system theme before first paint. -->
<link rel="preload" href="{{ base_path }}/assets/css/dark.css" as="style" />
<link
  rel="stylesheet"
  href="{{ base_path }}/assets/css/dark.css"
  media="(prefers-color-scheme: dark)"
  data-theme-dark
/>
<link
  rel="stylesheet"
  href="{{ base_path }}/assets/css/theme-transition.css?v=20261123-1"
/>
<script>
  (function () {
    var t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light";
    document.querySelector("link[data-theme-dark]").media =
      t === "dark" ? "all" : "not all";
    document.documentElement.style.colorScheme = t;
    document.documentElement.dataset.theme = t;
  })();
</script>

<meta http-equiv="cleartype" content="on" />
