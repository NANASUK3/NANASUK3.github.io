{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Restore saved language (EN/ZH) before first paint -->
<script>
  try {
    if (localStorage.getItem('site-lang') === 'zh') {
      document.documentElement.classList.add('lang-zh');
    }
  } catch (e) {}
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
{% if page.stylesheets %}
  {% for stylesheet in page.stylesheets %}
    <link rel="stylesheet" href="{{ stylesheet | prepend: base_path }}">
  {% endfor %}
{% endif %}

<!-- Dark theme: follows the OS via the media attribute; the masthead toggle
     flips it and the choice below is restored before first paint. -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/dark.css" media="(prefers-color-scheme: dark)" data-theme-dark>
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') {
        document.querySelector('link[data-theme-dark]').media = t === 'dark' ? 'all' : 'not all';
        document.documentElement.style.colorScheme = t;
      }
    } catch (e) {}
  })();
</script>

<meta http-equiv="cleartype" content="on">
