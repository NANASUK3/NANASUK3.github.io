<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
(function() {
  function closeAll() {
    document.querySelectorAll('.author__urls-wrapper.is-open').forEach(function(wrapper) {
      wrapper.classList.remove('is-open');
    });
  }

  function init() {
    document.querySelectorAll('.author__urls-wrapper').forEach(function(wrapper) {
      var button = wrapper.querySelector('button');
      var list = wrapper.querySelector('.author__urls');
      if (!button || !list) return;

      button.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();
        wrapper.classList.toggle('is-open');
      });
    });

    document.addEventListener('click', function() {
      closeAll();
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeAll();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

/* EN/ZH toggle: the button only shows on pages that actually carry .lang-zh
   content, and the choice persists in localStorage. */
(function() {
  function init() {
    var buttons = document.querySelectorAll('[data-lang-toggle]');
    if (!buttons.length) return;

    if (!document.querySelector('.lang-zh')) {
      buttons.forEach(function(button) { button.hidden = true; });
      return;
    }

    function updateLabel() {
      var zh = document.documentElement.classList.contains('lang-zh');
      buttons.forEach(function(button) {
        button.textContent = zh ? 'EN' : 'CN';
      });
    }

    buttons.forEach(function(button) {
      button.addEventListener('click', function() {
        var zh = document.documentElement.classList.toggle('lang-zh');
        try {
          localStorage.setItem('site-lang', zh ? 'zh' : 'en');
        } catch (e) {}
        updateLabel();
      });
    });

    updateLabel();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

/* Light/dark toggle: dark.css ships with media="(prefers-color-scheme: dark)"
   so the site follows the OS by default; this flips the link's media
   attribute and persists an explicit choice in localStorage. */
(function() {
  function effectiveTheme() {
    try {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') return saved;
    } catch (e) {}
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  function applyTheme() {
    var t = effectiveTheme();
    var link = document.querySelector('link[data-theme-dark]');
    if (link) link.media = (t === 'dark') ? 'all' : 'not all';
    document.querySelectorAll('[data-theme-toggle]').forEach(function(button) {
      button.innerHTML = t === 'dark'
        ? '<i class="fa-solid fa-sun" aria-hidden="true"></i>'
        : '<i class="fa-solid fa-moon" aria-hidden="true"></i>';
      button.setAttribute('aria-label', t === 'dark'
        ? '切换为浅色模式 / Switch to light mode'
        : '切换为深色模式 / Switch to dark mode');
    });
    var meta = document.querySelector('meta[name="theme-color"]:not([media])');
    if (meta) meta.setAttribute('content', t === 'dark' ? '#1b1d22' : '#ffffff');
  }

  function init() {
    var button = document.querySelector('[data-theme-toggle]');
    if (button) {
      button.addEventListener('click', function() {
        try {
          localStorage.setItem('theme', effectiveTheme() === 'dark' ? 'light' : 'dark');
        } catch (e) {}
        applyTheme();
      });
      if (window.matchMedia) {
        var query = window.matchMedia('(prefers-color-scheme: dark)');
        var onChange = function() {
          var saved = null;
          try { saved = localStorage.getItem('theme'); } catch (e) {}
          if (saved !== 'dark' && saved !== 'light') applyTheme();
        };
        if (query.addEventListener) query.addEventListener('change', onChange);
      }
    }
    applyTheme();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
