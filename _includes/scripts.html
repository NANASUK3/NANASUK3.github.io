{% unless include.home_layout %}
<script src="{{ base_path }}/assets/js/main.min.js"></script>
<script>
  (function () {
    function closeAll() {
      document
        .querySelectorAll(".author__urls-wrapper.is-open")
        .forEach(function (wrapper) {
          wrapper.classList.remove("is-open");
        });
    }

    function init() {
      document
        .querySelectorAll(".author__urls-wrapper")
        .forEach(function (wrapper) {
          var button = wrapper.querySelector("button");
          var list = wrapper.querySelector(".author__urls");
          if (!button || !list) return;

          button.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            wrapper.classList.toggle("is-open");
          });
        });

      document.addEventListener("click", function () {
        closeAll();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeAll();
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
{% endunless %}
<script>

  (function () {
    var darkPreference = window.matchMedia
      ? window.matchMedia("(prefers-color-scheme: dark)")
      : null;
    var themeButtons = document.querySelectorAll("[data-theme-choice]");
    var themeTransitionTimer = null;
    var themeTransitionDuration = 480;
    var activeThemeTransition = null;
    var themeChangeId = 0;

    function systemTheme() {
      return darkPreference && darkPreference.matches ? "dark" : "light";
    }

    function updateTheme(t) {
      var root = document.documentElement;
      var changed = root.dataset.theme !== t;
      var link = document.querySelector("link[data-theme-dark]");
      if (link) link.media = t === "dark" ? "all" : "not all";
      root.style.colorScheme = t;
      root.dataset.theme = t;
      themeButtons.forEach(function (button) {
        button.setAttribute("aria-pressed", button.dataset.themeChoice === t);
      });
      document
        .querySelectorAll('meta[name="theme-color"]')
        .forEach(function (meta) {
          meta.setAttribute("content", t === "dark" ? "#08090a" : "#ffffff");
        });
      if (changed) {
        document.dispatchEvent(
          new CustomEvent("site:themechange", { detail: { theme: t } }),
        );
      }
    }

    function resetThemeTransition(root) {
      window.clearTimeout(themeTransitionTimer);
      themeTransitionTimer = null;
      root.classList.remove(
        "theme-transitioning",
        "theme-transitioning-active",
      );
      delete root.dataset.themeTransitionTo;
      delete root.dataset.themeSnapshot;
      root.style.removeProperty("--theme-transition-from");
    }

    function applyFallbackTheme(t, root, previousTheme, changeId) {
      root.classList.add("theme-transitioning");
      root.dataset.themeTransitionTo = t;
      root.style.setProperty(
        "--theme-transition-from",
        previousTheme === "dark" ? "#08090a" : "#ffffff",
      );

      /* Make the full old-theme scrim exist before committing the new palette. */
      window.getComputedStyle(root, "::after").opacity;

      var requestFrame =
        window.requestAnimationFrame ||
        function (callback) {
          return window.setTimeout(callback, 16);
        };
      requestFrame(function () {
        if (changeId !== themeChangeId) return;
        updateTheme(t);
        requestFrame(function () {
          if (changeId !== themeChangeId) return;
          root.classList.add("theme-transitioning-active");
          themeTransitionTimer = window.setTimeout(function () {
            if (changeId !== themeChangeId) return;
            resetThemeTransition(root);
          }, themeTransitionDuration + 80);
        });
      });
    }

    function applyTheme(t, animate) {
      var root = document.documentElement;
      var previousTheme = root.dataset.theme;
      var themeChanged = previousTheme && previousTheme !== t;
      var reducedMotion =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var shouldAnimate = Boolean(animate && themeChanged && !reducedMotion);
      var changeId = ++themeChangeId;

      if (activeThemeTransition) {
        activeThemeTransition.skipTransition();
        activeThemeTransition = null;
      }
      resetThemeTransition(root);

      if (shouldAnimate && typeof document.startViewTransition === "function") {
        root.dataset.themeSnapshot = "";

        try {
          var transition = document.startViewTransition(function () {
            if (changeId === themeChangeId) updateTheme(t);
          });
          activeThemeTransition = transition;
          var finish = function () {
            if (changeId !== themeChangeId) return;
            activeThemeTransition = null;
            delete root.dataset.themeSnapshot;
          };
          transition.ready.catch(function () {});
          transition.finished.then(finish, finish);
          return;
        } catch (error) {
          delete root.dataset.themeSnapshot;
          /* Use the solid scrim fallback when snapshots cannot be created. */
        }
      }

      if (shouldAnimate) {
        applyFallbackTheme(t, root, previousTheme, changeId);
        return;
      }

      updateTheme(t);
    }

    function selectTheme(event) {
      applyTheme(event.currentTarget.dataset.themeChoice, true);
    }

    function init() {
      themeButtons.forEach(function (button) {
        button.addEventListener("click", selectTheme);
      });
      if (darkPreference) {
        var onChange = function () {
          applyTheme(systemTheme(), true);
        };
        if (darkPreference.addEventListener)
          darkPreference.addEventListener("change", onChange);
        else if (darkPreference.addListener) darkPreference.addListener(onChange);
      }
      applyTheme(systemTheme(), false);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
