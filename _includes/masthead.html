{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-nav-overflow"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul id="site-nav-overflow" class="hidden-links hidden"></ul>
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle data-theme="light" aria-label="切换深色模式 / Toggle dark mode"><span class="theme-toggle__icon" aria-hidden="true"></span></button>
      <button class="lang-toggle" type="button" data-lang-toggle aria-label="切换语言 / Switch language">CN</button>
    </div>
  </div>
</div>
