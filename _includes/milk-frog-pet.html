<aside
  class="milk-frog-pet"
  data-milk-frog-pet
  data-asset-base="{{ base_path }}/images/milk-frog/"
  data-asset-version="20261011-colorfix1"
  data-deepseek-pose-base="{{ base_path }}/images/deepseek/poses/"
  data-deepseek-pose-version="20261010-webp1"
  aria-label="主题页宠 / Theme companion"
>
  <button
    class="milk-frog-pet__button"
    type="button"
    aria-label="和奶蛙互动 / Interact with the milk frog"
    aria-describedby="milk-frog-message"
    title="轻点让奶蛙笑一笑，长按看看它在忙什么 / Tap to make the milk frog laugh, hold to see what it is up to"
  >
    <img
      class="milk-frog-pet__image"
      src="{{ base_path }}/images/milk-frog/idle-0.webp?v=20261011-colorfix1"
      width="192"
      height="208"
      alt=""
      decoding="async"
      fetchpriority="low"
    />
  </button>
  <span
    class="milk-frog-pet__message"
    id="milk-frog-message"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></span>
  <button
    class="deepseek-pet__button"
    type="button"
    aria-label="和 DeepSeek 娘互动 / Interact with DeepSeek"
    title="轻点切换动作，长按摸摸头 / Tap to change reactions, hold for a head pat"
  >
    <span class="deepseek-pet__art">
      <img
        class="deepseek-pet__image"
        src="{{ base_path }}/images/deepseek/idle.webp?v=20261010-webp1"
        width="320"
        height="332"
        alt=""
        decoding="async"
        fetchpriority="low"
      />
      <img
        class="deepseek-pet__blink-eye deepseek-pet__blink-eye--left"
        src="{{ base_path }}/images/deepseek/poses/blink.webp?v=20261010-webp1"
        width="320"
        height="332"
        alt=""
        aria-hidden="true"
        decoding="async"
      />
      <img
        class="deepseek-pet__blink-eye deepseek-pet__blink-eye--right"
        src="{{ base_path }}/images/deepseek/poses/blink.webp?v=20261010-webp1"
        width="320"
        height="332"
        alt=""
        aria-hidden="true"
        decoding="async"
      />
      <img
        class="deepseek-pet__pose"
        src="{{ base_path }}/images/deepseek/idle.webp?v=20261010-webp1"
        width="320"
        height="332"
        alt=""
        aria-hidden="true"
        decoding="async"
      />
      <span class="deepseek-pet__effects" aria-hidden="true">
        <span class="deepseek-pet__spark deepseek-pet__spark--one">✦</span>
        <span class="deepseek-pet__spark deepseek-pet__spark--two">✧</span>
        <span class="deepseek-pet__spark deepseek-pet__spark--three">·</span>
        <span class="deepseek-pet__reaction-icon"></span>
      </span>
    </span>
  </button>
  <span
    class="deepseek-pet__message"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  ></span>
</aside>
