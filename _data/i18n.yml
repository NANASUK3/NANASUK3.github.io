# ============================================================================
# 站点文案（中英对照）
#
# 这个文件集中维护主页上所有需要翻译的文字：
#   en: 英文文案    zh: 中文文案
#
# ⚠️ 目前所有 zh 文案是机器初稿，欢迎直接润色或重写。
#
# 说明：
#   - 支持内联 HTML（<a>、<strong>、<br>、<em> 等），与 about.md 中原写法一致；
#   - 多行文本用 |- 或 >- 开头（YAML 块写法），注意缩进保持一致；
#   - 保存后 GitHub Pages 会自动重新构建，稍等一两分钟即可在线上看到。
# ============================================================================

# 首页开头的自我介绍
# zh 含内嵌 HTML 属性，需要写成单行并转义引号（避免 YAML 折行在中文间插入空格）
intro:
  en: >-
    Welcome to my Homepage! I am currently a postgraduate student
    in Lab for Multimedia Intelligence (LAMI) at <a class="academic-link"
    href="https://www.ustc.edu.cn/" target="_blank">University of Science and
    Technology of China (USTC)</a>. Before that, I received my B.S. degree
    from <a class="academic-link" href="https://www.nwpu.edu.cn/"
    target="_blank">Northwestern Polytechnical University (NPU)</a> in 2026.
  zh: "欢迎来到我的个人主页！我目前是<a class=\"academic-link\" href=\"https://www.ustc.edu.cn/\" target=\"_blank\">中国科学技术大学</a>多媒体智能实验室（LAMI）的硕士研究生，在此之前，我于 2026 年在<a class=\"academic-link\" href=\"https://www.nwpu.edu.cn/\" target=\"_blank\">西北工业大学</a>获得工学学士学位。"

